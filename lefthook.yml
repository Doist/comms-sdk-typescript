# Git hooks for everyone, people and agents alike. `npm install` installs them (the
# `prepare` script). See CONTRIBUTING.md.
#
# GUI git clients often run hooks without node on PATH: the node checks are skipped with a
# message, and CI runs them.

pre-commit:
    piped: true
    jobs:
        - name: no-node
          skip:
              - run: command -v node >/dev/null 2>&1 && command -v npx >/dev/null 2>&1
          run: echo "pre-commit - node not found, so lint, format and the type check were skipped. CI still runs them."
        - name: lint
          glob: '*.{ts,tsx,js,jsx}'
          # CI lints the SDK, not the docs site, which has its own conventions.
          exclude: 'website/**'
          skip: &no-node
              - run: '! command -v node >/dev/null 2>&1 || ! command -v npx >/dev/null 2>&1'
          run: npx oxlint --fix {staged_files}
          stage_fixed: true
        - name: format
          glob: '*.{ts,tsx,js,jsx,cjs,mjs,md,yml,yaml,css,json}'
          skip: *no-node
          run: npx oxfmt --no-error-on-unmatched-pattern {staged_files}
          stage_fixed: true
        - name: types
          skip: *no-node
          run: npm run type-check

pre-push:
    piped: true
    jobs:
        - name: no-node
          skip:
              - run: command -v node >/dev/null 2>&1 && command -v npm >/dev/null 2>&1
          run: echo "pre-push - node not found, so the tests were skipped. CI still runs them."
        - name: tests
          skip:
              - run: '! command -v node >/dev/null 2>&1 || ! command -v npm >/dev/null 2>&1'
          run: npm test
